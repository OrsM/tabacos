[project]
name = "tabacos"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasette>=0.65.5",
    "holidays>=0.106",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "sqlite-utils>=4.2.1",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]
dev = [
    "pytest>=9.1.1",
]
report = [
    "markdown>=3.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
