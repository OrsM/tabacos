title: Spain tobacco market
description: Comisionado para el Mercado de Tabacos monthly reports, parsed. Source data reusable under Ley 37/2007 with attribution.
source: Comisionado para el Mercado de Tabacos
databases:
  tobacco:
    tables:
      regional_sales:
        description: Cumulative year-to-date cigarette packs (20 units) per autonomous community, Peninsula and Balearics.
      segment_sales:
        description: Best-selling cigarette brands per price tier; share_pct is of that month's packs.
      avg_price:
        description: Average retail price (EUR) per product. period is a year (annual series from 2011) or YYYY-MM.
      monthly_packs:
        description: National cigarette packs per report, from year-to-date differences. months = 2 where the previous month's report does not exist (August after June).
      annual_cigarettes:
        description: Calendar-year packs (December year-to-date) beside the annual average price.
      tax_rates:
        description: Tobacco excise by version of Ley 38/1992 art. 60 (euros; pesetas converted at 166.386). specific is EUR per 1000 cigarettes or per kg; minimum is the floor on the tax, and minimum_raised applies to products priced under minimum_below_price per 1000 units (per kg). effective_from follows the law's own effect dates where they differ from the BOE version date.
      vat_rates:
        description: General VAT rate from Ley 37/1992 art. 90.
      segment_tax:
        description: Each best-selling brand price split into excise, VAT and the remainder, using the rates in force that month. regime says which part of the tariff sets the excise.
      events:
        description: Dates on which tobacco excise or VAT rates changed, and which fields moved. Source is the BOE text that made the change.
      result_stockpiling:
        description: Output of analyses/stockpiling - year-on-year growth of December and January around the 1 January 2025 tax rise, with placebo winters.
      price_listings:
        description: Retail prices (PVP, incl. all taxes) that the Comisionado publishes in the BOE, Peninsula and Balearics only. A listing takes effect the day it is published. Mostly new and changed prices, not a full price list.
      price_changes:
        description: A product listed at a different price than its previous listing. pct is the change in percent. Names are matched case-blind; a renamed product shows as a new one.
    queries:
      brand_share_and_price_by_year:
        sql: select substr(month, 1, 4) as year, tier, round(avg(price), 2) as price, round(avg(share_pct), 2) as share_pct from segment_sales where brand = :brand group by year, tier order by year, tier
      price_vs_volume_monthly:
        sql: select substr(m.period_end, 1, 7) as month, m.packs, m.months, p.price from monthly_packs m join avg_price p on p.period = substr(m.period_end, 1, 7) and p.product = 'cigarrillos' order by month
      annual_prices:
        sql: select period as year, product, price from avg_price where length(period) = 4 order by period, product
      brand_price_by_month:
        sql: select month, brand, tier, price, share_pct from segment_sales where brand = :brand order by month
