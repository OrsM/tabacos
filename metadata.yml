title: Spain tobacco market
description: Comisionado para el Mercado de Tabacos monthly reports, parsed. Source data reusable under Ley 37/2007 with attribution.
source: Comisionado para el Mercado de Tabacos
source_url: https://www.hacienda.gob.es/Tabacos/
about: Code, method and the analysis reports (Markdown, with charts)
about_url: https://github.com/OrsM/tabacos
databases:
  tobacco:
    tables:
      regional_sales:
        description: Cumulative year-to-date cigarette packs (20 units) per autonomous community, Peninsula and Balearics.
      segment_sales:
        description: Best-selling cigarette brands per price tier; share_pct is of that month's packs.
      avg_price:
        description: Average retail price (EUR) per product. period is a year (annual series from 2011) or YYYY-MM.
      monthly_packs:
        description: View. National cigarette packs per month from the Comisionado's brand files (final monthly figures, July included), 2013 onward.
      monthly_packs_pdf:
        description: View. National packs per PDF report from year-to-date differences; months = 2 where a report is missing. Kept to check the brand files against; up to 7% off between neighbouring months where a year-to-date total was revised.
      monthly_unit_price:
        description: View. Average retail price per pack of the whole market per month, euros over packs from the brand files; from 2016 (2013-14 have packs only, 2015 euros only).
      brand_sales:
        description: Monthly cigarette sales by brand, every brand, in packs of 20 and euros of retail value (Comisionado Estadisticas_Ventas Excel files), Peninsula and Balearics. Packs 2013-2014 and 2016 onward; euros 2015 onward.
      annual_cigarettes:
        description: Calendar-year packs (December year-to-date) beside the annual average price.
      tax_rates:
        description: Tobacco excise by version of Ley 38/1992 art. 60 (euros; pesetas converted at 166.386). specific is EUR per 1000 cigarettes or per kg; minimum is the floor on the tax, and minimum_raised applies to products priced under minimum_below_price per 1000 units (per kg). effective_from follows the law's own effect dates where they differ from the BOE version date.
      vat_rates:
        description: General VAT rate from Ley 37/1992 art. 90.
      segment_tax:
        description: Each best-selling brand price split into excise, VAT and the remainder, using the rates in force that month. regime says which part of the tariff sets the excise.
      events:
        description: Dates on which tobacco excise or VAT rates changed, and which fields moved. Source is the BOE text that made the change.
      result_stockpiling:
        description: Output of analyses/stockpiling - year-on-year growth of December and January around the 1 January 2025 tax rise, with placebo winters.
      price_listings:
        description: Retail prices (PVP, incl. all taxes) that the Comisionado publishes in the BOE, Peninsula and Balearics only. A listing takes effect the day it is published. Mostly new and changed prices, not a full price list.
      price_changes:
        description: A product listed at a different price than its previous listing. pct is the change in percent. Names are matched case-blind; a renamed product shows as a new one.
      result_passthrough:
        description: Output of analyses/passthrough - per tax change and tariff regime at the old price, the median price change against the tax-implied change and the change in the pre-tax remainder (d_net, EUR per pack).
      result_passthrough_changes:
        description: Every cigarette price change used by analyses/passthrough with its tax-implied price, d_net and pass-through ratio.
      result_passthrough_baseline:
        description: Ordinary repricing per year, from price changes outside every tax window.
      brand_month:
        description: View. One row per brand and month, merging the price tiers a brand is listed in (share summed, price weighted by share). Best sellers only, so a brand can drop out of the list in a month.
      result_panel:
        description: Output of analyses/panel - slope of log share on log relative price by the number of months between observations, with brand-clustered standard error.
      result_panel_dispersion:
        description: Share-weighted standard deviation of log price across the listed brands, per month.
      result_taxshock_curve:
        description: Output of analyses/taxshock - one row per specification (window, handling of list artefacts, brand weighting, placebo exclusion zone) with the reduced form, first stage, IV ratio and the event estimate in placebo standard deviations (z).
      result_market_curve:
        description: Output of analyses/market - one row per specification (price measure, volume basis, trend, Covid and stockpile handling, price lag, sample start) of the elasticity of national cigarette volume to a price index, with HAC interval.
      result_border_curve:
        description: Output of analyses/border - one row per specification of the elasticity of tourist-and-border (or national, or the ratio of) cigarette volume to the Spanish price index in border and tourist provinces.
      tourist_arrivals:
        description: International tourist arrivals by main destination region, monthly (INE FRONTUR, table 10823). Seven regions plus the national total.
      tourist_monthly:
        description: View. National and tourist-and-border packs per province and report period from year-to-date differences; months is 2 where a report is missing.
      revisions:
        description: Values that a newer report changed from an older one, for tables with overlapping reports (regional_sales, tourist_sales). Empty means every overlap agreed.
      tobacco_hicp:
        description: Monthly tobacco price index (HICP) for Spain, France, Portugal and Ireland, 2015 = 100. ECOICOP version 1 to December 2025, version 2 (2025 = 100) rescaled onto it afterwards.
      tobacco_pli:
        description: Annual tobacco price level index, EU27 = 100 (Eurostat prc_ppp_ind, latest year 2024).
      foreign_price_gap:
        description: Monthly log of France's (or Portugal's) tobacco price level over Spain's. Each year is anchored on the annual price level index and moved by the monthly HICP inside the year; after 2024 it follows the HICP alone.
    queries:
      brand_share_and_price_by_year:
        sql: select substr(month, 1, 4) as year, tier, round(avg(price), 2) as price, round(avg(share_pct), 2) as share_pct from segment_sales where brand = :brand group by year, tier order by year, tier
      price_vs_volume_monthly:
        sql: select substr(m.period_end, 1, 7) as month, m.packs, m.months, p.price from monthly_packs m join avg_price p on p.period = substr(m.period_end, 1, 7) and p.product = 'cigarrillos' order by month
      annual_prices:
        sql: select period as year, product, price from avg_price where length(period) = 4 order by period, product
      brand_price_by_month:
        sql: select month, brand, tier, price, share_pct from segment_sales where brand = :brand order by month
